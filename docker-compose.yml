services:
  platform-db:
    image: postgres:15-alpine
    container_name: platform-postgres
    restart: always
    environment:
      POSTGRES_USER: course_user
      POSTGRES_PASSWORD: course_password
      POSTGRES_DB: course_catalog
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  platform-app:
    build: .
    container_name: platform-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: platform-db
      DB_PORT: "5432"
      DB_USER: course_user
      DB_PASSWORD: course_password
      DB_NAME: course_catalog
    depends_on:
      - platform-db

volumes:
  pg_data: