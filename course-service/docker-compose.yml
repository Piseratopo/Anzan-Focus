services:
  course-db:
    image: postgres:15-alpine
    container_name: course-postgres
    restart: always
    environment:
      POSTGRES_USER: course_user
      POSTGRES_PASSWORD: course_password
      POSTGRES_DB: course_catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Add this line to automatically run the table creation SQL on startup:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  course-app:
    build: .
    container_name: course-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: course-db
      DB_PORT: "5432"
      DB_USER: course_user
      DB_PASSWORD: course_password
      DB_NAME: course_catalog
    depends_on:
      - course-db

volumes:
  postgres_data: